<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section id="hero">
    <h1>JET NINA SANGLAP</h1>
    <p>I am a web developer specializing in fast, responsive websites.</p>
  </section>

  <section id="projects">
    <h2>Projects</h2>
    <div class="project">
      <h3>Project Title</h3>
      <p>Tech Stack: HTML, CSS, JS</p>
      <p>Problem: ... Solution: ...</p>
    </div>
  </section>

  <section id="resume">
    <h2>Resume</h2>
    <p>Skills: HTML, CSS, JavaScript</p>
  </section>

  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Name" required>
      <input type="email" placeholder="Email" required>
      <textarea placeholder="Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

</body>
</html>
